# /etc/nginx/sites-available/filo-api (example path on server)
# Nginx configuration for Filo API

# Upstream server (your NestJS application)
upstream nestjs_app {
    server 127.0.0.1:4000; # Assuming NestJS runs on port 4000
    # If running in Docker, this might be service_name:container_port e.g., filo_api_container:4000
    # keepalive 64; # Optional: keepalive connections to upstream
}

# Rate limiting zone
# Limits requests to 10 per second per IP, with a burst of 20
limit_req_zone $binary_remote_addr zone=filo_api_limit:10m rate=10r/s;

# Server block for HTTP (port 80) - Redirects to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name your_domain.com www.your_domain.com; # Replace with your actual domain

    # For Let's Encrypt certificate renewal
    location ~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html; # Or a directory dedicated to certbot challenges
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Server block for HTTPS (port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your_domain.com www.your_domain.com; # Replace with your actual domain

    # SSL Certificate paths (managed by Certbot/Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/your_domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your_domain.com/privkey.pem;
    # ssl_trusted_certificate /etc/letsencrypt/live/your_domain.com/chain.pem; # Optional for OCSP stapling

    # SSL Configuration (modern compatibility)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m; # about 40000 sessions
    ssl_session_tickets off;
    # ssl_stapling on; # Optional: OCSP Stapling
    # ssl_stapling_verify on; # Optional: OCSP Stapling
    # resolver 8.8.8.8 8.8.4.4 valid=300s; # Optional: DNS resolver for OCSP stapling

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; object-src 'none';" always; # Adjust CSP as needed
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Access and error logs
    access_log /var/log/nginx/filo_api.access.log;
    error_log /var/log/nginx/filo_api.error.log;

    # Max body size for uploads (adjust as needed for your application)
    client_max_body_size 100M;

    location / {
        # Apply rate limiting
        limit_req zone=filo_api_limit burst=20 nodelay;

        proxy_pass http://nestjs_app; # Proxy to the upstream NestJS app
        proxy_set_header Host $host; # Pass original host header
        proxy_set_header X-Real-IP $remote_addr; # Pass real client IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # Pass list of IPs
        proxy_set_header X-Forwarded-Proto $scheme; # Pass original protocol (http/https)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade"; # For WebSocket support if needed
        proxy_read_timeout 300s; # Adjust as needed
        proxy_connect_timeout 75s; # Adjust as needed

        # CORS Headers (if you need Nginx to handle them, though NestJS already does)
        # if ($request_method = 'OPTIONS') {
        #    add_header 'Access-Control-Allow-Origin' '${FRONTEND_URL}'; # Use your frontend URL
        #    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
        #    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
        #    add_header 'Access-Control-Allow-Credentials' 'true';
        #    add_header 'Access-Control-Max-Age' 1728000;
        #    add_header 'Content-Type' 'text/plain charset=UTF-8';
        #    add_header 'Content-Length' 0;
        #    return 204;
        # }
        # add_header 'Access-Control-Allow-Origin' '${FRONTEND_URL}' always;
        # add_header 'Access-Control-Allow-Credentials' 'true' always;
    }

    # You can add other locations here, e.g., for serving static files if needed
    # location /static/ {
    #    alias /path/to/your/static/files/;
    # }
} 